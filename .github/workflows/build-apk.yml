name: Build & Release Bumiayu TV Launcher APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-ABI APKs & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build Multi-ABI APKs
        run: |
          gradle -p tv-hub-android assembleDebug --no-daemon

      - name: Organize & Rename Multi-ABI APKs
        run: |
          mkdir -p release-apks
          cd tv-hub-android/app/build/outputs/apk/debug/
          for f in *.apk; do
            echo "Processing $f"
            case "$f" in
              *armeabi-v7a*) cp "$f" ../../../../../release-apks/bumiayu-tv-armeabi-v7a-32bit.apk ;;
              *arm64-v8a*)   cp "$f" ../../../../../release-apks/bumiayu-tv-arm64-v8a-64bit.apk ;;
              *x86_64*)      cp "$f" ../../../../../release-apks/bumiayu-tv-x86_64-64bit.apk ;;
              *x86*)         cp "$f" ../../../../../release-apks/bumiayu-tv-x86-32bit.apk ;;
              *universal*)   cp "$f" ../../../../../release-apks/bumiayu-tv-universal.apk ;;
              *)             cp "$f" ../../../../../release-apks/bumiayu-tv-debug.apk ;;
            esac
          done
          cd ../../../../../release-apks/
          ls -la

      - name: Upload Multi-ABI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BumiayuTV-MultiABI-APKs
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          name: Bumiayu TV Launcher ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
