name: Build Bumiayu TV Launcher APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "tv-hub-android/**"
      - "tv-hub/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build Debug APK
        run: gradle -p tv-hub-android assembleDebug --no-daemon

      - name: Upload Bumiayu TV Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: BumiayuTVLauncher-APK
          path: tv-hub-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
