<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumiayu TV - Premium Home Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER STATUS & JAM -->
    <header class="header-bar">
        <h1 class="brand-title">Bumiayu TV</h1>
        <div id="clock-display" class="clock-display">--:--</div>
    </header>

    <main class="container">
        <!-- BARIS 1: REKOMENDASI UTAMA / UTILITY (CLONE YOUTUBE & MUSIC CONTROLLER) -->
        <section aria-labelledby="row-title-entertainment">
            <h2 id="row-title-entertainment" class="row-title">Hiburan & Ekosistem</h2>
            <div class="grid-row">
                <!-- Shortcut SmartTube yang di-clone menjadi YouTube Official -->
                <button class="tv-card" onclick="launchYouTube()" aria-label="Buka YouTube">
                    <img class="icon" src="assets/youtube_tv.png" alt="YouTube">
                    <span class="title">YouTube</span>
                </button>

                <!-- Widget Cepat Integrasi Kontrol Server Musik Senandung -->
                <button class="tv-card" onclick="controlSenandung('toggle-play')" aria-label="Kontrol Musik Senandung">
                    <img class="icon" src="assets/senandung.png" alt="Senandung">
                    <span class="title">Senandung (Play/Pause)</span>
                </button>
            </div>
        </section>

        <!-- BARIS 2: WEB TV SALURAN NASIONAL & INTERNASIONAL (DENGAN DETEKTOR LIVE) -->
        <section aria-labelledby="row-title-webtv">
            <h2 id="row-title-webtv" class="row-title">Saluran Web TV Live</h2>
            <div class="grid-row">
                <!-- Channel Nasional: Kompas TV -->
                <button class="tv-card" data-stream="https://op-group1-swiftservehd-1.dens.tv/s/s104/index.m3u8" onclick="playStream(this.getAttribute('data-stream'), 'Kompas TV')" aria-label="Tonton Kompas TV">
                    <span class="status-badge status-checking">Checking...</span>
                    <span class="title">Kompas TV</span>
                </button>

                <!-- Channel Internasional: NHK World -->
                <button class="tv-card" data-stream="https://nhkwlive-ojp.akamaized.net/hls/live/2003459/nhkwlive-ojp-en/index.m3u8" onclick="playStream(this.getAttribute('data-stream'), 'NHK World Japan')" aria-label="Tonton NHK World">
                    <span class="status-badge status-checking">Checking...</span>
                    <span class="title">NHK World</span>
                </button>

                <!-- Kategori 18+ Terkunci Proteksi Keamanan PIN -->
                <button class="tv-card" data-stream="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" onclick="openAdultChannel(this.getAttribute('data-stream'))" aria-label="Buka Kategori Dewasa Terkunci">
                    <span class="status-badge status-checking">Checking...</span>
                    <span class="title">Kategori 18+ (🔒)</span>
                </button>
            </div>
        </section>

        <!-- BARIS 3: PENGATURAN & SISTEM LENGKAP -->
        <section aria-labelledby="row-title-settings">
            <h2 id="row-title-settings" class="row-title">Pengaturan & Sistem</h2>
            <div class="grid-row">
                <!-- Wi-Fi & Jaringan -->
                <button class="tv-card" onclick="openSettings('wifi')" aria-label="Pengaturan Wi-Fi dan Jaringan">
                    <img class="icon" src="assets/wifi.png" alt="Wi-Fi">
                    <span class="title">Wi-Fi & Jaringan</span>
                </button>

                <!-- Bluetooth & Remote -->
                <button class="tv-card" onclick="openSettings('bluetooth')" aria-label="Pengaturan Bluetooth dan Remote">
                    <img class="icon" src="assets/bluetooth.png" alt="Bluetooth">
                    <span class="title">Remote & Bluetooth</span>
                </button>

                <!-- Kelola Aplikasi -->
                <button class="tv-card" onclick="openSettings('apps')" aria-label="Kelola Aplikasi">
                    <img class="icon" src="assets/apps.png" alt="Aplikasi">
                    <span class="title">Kelola Aplikasi</span>
                </button>

                <!-- Pengaturan Perangkat / Sistem Lengkap -->
                <button class="tv-card" onclick="openSettings('device')" aria-label="Pengaturan Sistem Perangkat">
                    <img class="icon" src="assets/settings.png" alt="Pengaturan">
                    <span class="title">Setelan Perangkat</span>
                </button>
            </div>
        </section>
    </main>

    <!-- DIALOG MODAL PIN KATEGORI 18+ (NATIVE HTML5 <dialog>) -->
    <dialog id="adult-pin-dialog" aria-labelledby="pin-dialog-title" aria-modal="true">
        <div class="dialog-header">
            <h3 id="pin-dialog-title">Kunci Pengaman 18+</h3>
            <p>Masukkan 4-digit PIN menggunakan Remote D-Pad</p>
        </div>
        <div id="pin-display" class="pin-display">----</div>
        <div class="pin-keypad">
            <button class="pin-btn" onclick="inputPinDigit('1')">1</button>
            <button class="pin-btn" onclick="inputPinDigit('2')">2</button>
            <button class="pin-btn" onclick="inputPinDigit('3')">3</button>
            <button class="pin-btn" onclick="inputPinDigit('4')">4</button>
            <button class="pin-btn" onclick="inputPinDigit('5')">5</button>
            <button class="pin-btn" onclick="inputPinDigit('6')">6</button>
            <button class="pin-btn" onclick="inputPinDigit('7')">7</button>
            <button class="pin-btn" onclick="inputPinDigit('8')">8</button>
            <button class="pin-btn" onclick="inputPinDigit('9')">9</button>
            <button class="pin-btn" onclick="clearPinInput()">C</button>
            <button class="pin-btn" onclick="inputPinDigit('0')">0</button>
            <button class="pin-btn" onclick="closePinDialog()">✕</button>
        </div>
    </dialog>

    <!-- OVERLAY PEMUTAR VIDEO FULLSCREEN -->
    <div id="video-overlay" role="region" aria-label="Pemutar Video Layar Penuh">
        <video id="main-player" playsinline></video>
        <div id="player-osd">
            <span id="osd-title" style="font-weight: 700; font-size: 1.1rem;">Live TV</span>
            <span class="status-badge status-online">LIVE</span>
            <span style="font-size: 0.85rem; color: rgba(255,255,255,0.7);">Tekan Back untuk keluar</span>
        </div>
    </div>

    <!-- TOAST NOTIFIKASI -->
    <div id="toast-notification" role="status" aria-live="polite"></div>

    <!-- SCRIPT UTAMA KONTROLER -->
    <script src="hls.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
